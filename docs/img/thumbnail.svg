<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t d">
  <title id="t">Bell-Test Lab thumbnail</title>
  <desc id="d">A CHSH gauge whose needle has passed the local bound S = 2 into the quantum zone, above two entangled qubits linked by a wave.</desc>
  <rect width="1024" height="1024" rx="0" fill="#0e1320"/>
  <!-- gauge: 0..4 mapped to 180 degrees; local zone 0..2 grey, quantum 2..2.83 blue, beyond red -->
  <g fill="none" stroke-width="88" stroke-linecap="butt">
    <path d="M 172 560 A 340 340 0 0 1 512 220" stroke="#4b5672"/>
    <path d="M 512 220 A 340 340 0 0 1 727.8 297.1" stroke="#56b4e9"/>
    <path d="M 727.8 297.1 A 340 340 0 0 1 852 560" stroke="#7a3b47"/>
  </g>
  <!-- tick at S = 2 -->
  <line x1="512" y1="160" x2="512" y2="282" stroke="#e8edf6" stroke-width="14"/>
  <!-- needle at S = 2.70: angle 180 - 2.70/4*180 = 58.5 degrees from +x -->
  <line x1="512" y1="560" x2="671" y2="301" stroke="#e8edf6" stroke-width="30" stroke-linecap="round"/>
  <circle cx="512" cy="560" r="40" fill="#e8edf6"/>
  <text x="512" y="470" text-anchor="middle" font-family="STIX Two Text, Latin Modern Roman, Cambria, Times New Roman, serif" font-style="italic" font-size="150" fill="#e8edf6">S</text>
  <!-- two qubits and the entanglement wave -->
  <path d="M 300 800 C 360 720, 420 720, 456 800 S 552 880, 588 800 S 684 720, 724 800" fill="none" stroke="#74b9ff" stroke-width="22" stroke-linecap="round"/>
  <circle cx="242" cy="800" r="74" fill="#151c2b" stroke="#56b4e9" stroke-width="22"/>
  <circle cx="782" cy="800" r="74" fill="#151c2b" stroke="#e69f00" stroke-width="22"/>
  <text x="242" y="838" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="104" fill="#e8edf6">A</text>
  <text x="782" y="838" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="104" fill="#e8edf6">B</text>
</svg>
